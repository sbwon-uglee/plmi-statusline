name: 검사

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # 상태줄은 맥에서 돌고 구운 결과도 맥 기준이다
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # 굽기 검사가 numpy 와 pillow 를 받는다. 없으면 그 검사를 건너뛴다
      - uses: astral-sh/setup-uv@v5

      - name: 검사
        run: python3 tests/run.py

      - name: 검사가 실제로 잡는지
        run: python3 tests/mutate.py

  bake:
    # 소스만 고치고 굽지 않으면 받는 사람에게는 안 바뀐 채로 간다
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: 다시 구워 저장소와 같은지
        run: |
          ./build.sh
          # 새로 생긴 파일도 본다. 커밋에서 빠진 크기가 다시 구워지면 diff 로는 안 보인다
          test -z "$(git status --porcelain plmi/sprites/anim)" \
            || { git status --short plmi/sprites/anim; echo "구운 결과가 저장소와 다르다. ./build.sh 를 돌리고 커밋할 것" >&2; exit 1; }
